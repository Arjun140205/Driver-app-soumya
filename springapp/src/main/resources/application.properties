spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql=true
enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
server.port=8080
cancellation.cutoff-hours=${CANCELLATION_CUTOFF_HOURS:2}

# ---- Gemini AI features (optional). Leave the key empty to use the built-in fallback logic. ----
gemini.api.key=${GEMINI_API_KEY:}
gemini.embedding.model=text-embedding-004
gemini.generation.model=gemini-2.0-flash

# ---- Predefined admin: created at start-up when no user with this e-mail exists yet. ----
# This is the ONLY way to get the first admin; sign-up can only create customers.
# Change these (or set the ADMIN_* environment variables) before deploying anywhere real.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@driveu.com}
app.admin.mobile=${ADMIN_MOBILE:9999999999}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---- OTP verification (sign-up) ----
# When true, /api/register is refused unless the e-mail AND the mobile number were verified by OTP.
otp.verification-required=true
otp.expiry-minutes=5
otp.resend-cooldown-seconds=30
otp.max-attempts=5
otp.verified-validity-minutes=15
# true  = when SMTP / SMS credentials are missing, the OTP is printed in the server console instead of being sent
#         (handy for local development; the OTP is never returned to the browser).
# false = refuse to send OTPs unless a real provider is configured.
otp.dev-mode=${OTP_DEV_MODE:true}

# ---- E-mail OTP over SMTP: Gmail account driveudemo1@gmail.com with an app password (smtp.gmail.com:587, STARTTLS) ----
# The MAIL_USERNAME / MAIL_PASSWORD environment variables, when set, override the values after the colon.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:driveudemo1@gmail.com}
spring.mail.password=${MAIL_PASSWORD:amyfnzzvdjxemzdc}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}

# ---- Mobile OTP over SMS (Twilio REST API) ----
otp.sms.country-code=${SMS_COUNTRY_CODE:+91}
otp.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
otp.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
otp.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ---- Login sessions (JWT) ----
# Empty = a new random secret is generated every time the server starts, so everybody is logged out when the
# server restarts (also when spring-boot-devtools restarts it after a code change).
# Set JWT_SECRET to a long random text if logins should survive a restart (e.g. with a real MySQL database).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
